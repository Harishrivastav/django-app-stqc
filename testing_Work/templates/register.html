{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow">

<div class="card-header bg-primary text-white text-center">

<h4>Testing Engineer Registration</h4>

</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Username</label>

{{form.username}}

</div>

<div class="mb-3">

<label>Email</label>

{{form.email}}

</div>

<div class="mb-3">

<label>Password</label>

{{form.password1}}

</div>

<div class="mb-3">

<label>Confirm Password</label>

{{form.password2}}

</div>

<button class="btn btn-success w-100">

Register

</button>

</form>

<hr>

<p class="text-center">

Already have an account?

<a href="/login/">Login Here</a>

</p>

</div>

</div>

</div>

</div>

{% endblock %}
